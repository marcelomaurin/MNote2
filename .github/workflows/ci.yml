name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project-integrity:
    name: Lazarus project integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate MNote2.lpi and active sources
        shell: bash
        run: python3 scripts/check_lazarus_project.py

      - name: Validate version sync
        shell: bash
        run: python3 scripts/check_version_sync.py

      - name: Verify CHATGPT package boundary
        shell: bash
        run: |
          grep -q 'openai_core' src/MNote2.lpi
          grep -q 'openai_agent' src/MNote2.lpi
          grep -q 'openai_project_core' src/MNote2.lpi
          grep -q 'openai_files' src/MNote2.lpi
          grep -q 'openai_output' src/MNote2.lpi
          grep -q 'aispeechrecognizer' src/services/mnote_voice_input_service.pas
          grep -q 'aiwhisperengine' src/services/mnote_voice_input_service.pas
          grep -q 'aiaudio' src/services/mnote_voice_input_service.pas
          test -f src/services/mnote_chatgpt_agent_service.pas
          test -f src/services/mnote_developer_agent_service.pas
          test -f src/services/mnote_multiagent_service.pas
          test -f src/services/mnote_recovery_coordinator.pas
          grep -q 'aiagent_sourceactions' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'aiagent_testaction' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'RegisterAction(FReadAction)' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'RegisterAction(FReplaceAction)' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'RegisterAction(FBuildAction)' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'RegisterAction(FTestAction)' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'ForcarSimulacaoGlobal := True' src/services/mnote_developer_agent_service.pas
          grep -q 'ExecutePreparedPlan(FLastPlan)' src/services/mnote_developer_agent_service.pas
          grep -q 'TAIAgentMemoryRegistry' src/services/mnote_multiagent_service.pas
          grep -q 'TAIAgentCapabilityRouter' src/services/mnote_multiagent_service.pas
          grep -q 'TAIStrongSupervisor' src/services/mnote_multiagent_service.pas
          grep -q "AgentMemory(ADecision.Route.AgentId)" src/services/mnote_multiagent_service.pas
          grep -q 'Profile(airArbiter)' src/services/mnote_multiagent_service.pas
          grep -q 'RecordReviewedExecution' src/services/mnote_multiagent_service.pas
          grep -q 'TMNoteRecoveryCoordinator' src/services/mnote_recovery_coordinator.pas
          grep -q 'mraRetrySame' src/services/mnote_recovery_coordinator.pas
          grep -q 'mraSwitchAgent' src/services/mnote_recovery_coordinator.pas
          grep -q 'mraEscalateStrong' src/services/mnote_recovery_coordinator.pas
          grep -q 'ai-training' src/services/mnote_recovery_coordinator.pas
          grep -q 'pending.jsonl' src/services/mnote_recovery_coordinator.pas
          grep -q 'mlmRAG' src/services/mnote_recovery_coordinator.pas
          grep -q 'mlmLoRA' src/services/mnote_recovery_coordinator.pas
          grep -q 'MaxAttempts = 3' src/ui/mnote_legacy_ui_bridge.pas
          grep -q 'MNoteRecoveryCoordinator' src/ui/mnote_legacy_ui_bridge.pas
          grep -q 'SetChatGPT(MNoteAI.Profile(Decision.Role).Client)' src/ui/mnote_legacy_ui_bridge.pas
          grep -q 'ConfirmDeveloperPlan' src/ui/mnote_legacy_ui_bridge.pas
          grep -q 'AI Developer - Corrigir fontes' src/ui/mnote_legacy_ui_bridge.pas

  portable-core:
    name: Core ${{ matrix.name }} x64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lazarus and Free Pascal
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: "4.4"
          with-cache: false

      - name: Compile portable core
        shell: bash
        run: lazbuild -B --cpu=x86_64 tests/ci_core_runner.lpi

      - name: Run portable core on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: tests/ci-bin/x86_64-linux/ci_core_runner

      - name: Run portable core on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem -LiteralPath tests/ci-bin -Recurse -Filter ci_core_runner.exe | Select-Object -First 1
          if ($null -eq $binary) { throw 'ci_core_runner.exe não foi gerado.' }
          & $binary.FullName
          exit $LASTEXITCODE

  main-project-build:
    name: Main project build (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lazarus and Free Pascal
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: "4.4"
          with-cache: false

      - name: Build src/MNote2.lpi
        shell: bash
        run: lazbuild -B src/MNote2.lpi
