name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project-integrity:
    name: Lazarus project integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate MNote2.lpi and active sources
        shell: bash
        run: python3 scripts/check_lazarus_project.py

      - name: Verify CHATGPT package boundary
        shell: bash
        run: |
          grep -q 'openai_core' src/MNote2.lpi
          grep -q 'openai_agent' src/MNote2.lpi
          grep -q 'openai_project_core' src/MNote2.lpi
          grep -q 'openai_files' src/MNote2.lpi
          grep -q 'openai_output' src/MNote2.lpi
          grep -q 'aispeechrecognizer' src/services/mnote_voice_input_service.pas
          grep -q 'aiwhisperengine' src/services/mnote_voice_input_service.pas
          grep -q 'aiaudio' src/services/mnote_voice_input_service.pas
          test -f src/services/mnote_chatgpt_agent_service.pas
          test -f src/services/mnote_developer_agent_service.pas
          grep -q 'aiagent_sourceactions' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'aiagent_testaction' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'RegisterAction(FReadAction)' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'RegisterAction(FReplaceAction)' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'RegisterAction(FBuildAction)' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'RegisterAction(FTestAction)' src/services/mnote_chatgpt_agent_service.pas
          grep -q 'ForcarSimulacaoGlobal := True' src/services/mnote_developer_agent_service.pas
          grep -q 'ExecutePreparedPlan(FLastPlan)' src/services/mnote_developer_agent_service.pas
          grep -q 'AI Developer - Corrigir fontes' src/ui/mnote_legacy_ui_bridge.pas

  portable-core:
    name: Core ${{ matrix.name }} x64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lazarus and Free Pascal
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: "4.4"
          with-cache: false

      - name: Compile portable core
        shell: bash
        run: lazbuild -B --cpu=x86_64 tests/ci_core_runner.lpi

      - name: Run portable core on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: tests/ci-bin/x86_64-linux/ci_core_runner

      - name: Run portable core on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem -LiteralPath tests/ci-bin -Recurse -Filter ci_core_runner.exe | Select-Object -First 1
          if ($null -eq $binary) { throw 'ci_core_runner.exe não foi gerado.' }
          & $binary.FullName
          exit $LASTEXITCODE
